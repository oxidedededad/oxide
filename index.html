<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OXIDE — Ввод ключа</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #000;
    color: #e8e8e8;
    font-family: Consolas, Monaco, monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  .bg {
    position: fixed;
    inset: 0;
    background: url("oxide.jpg") center / cover no-repeat, radial-gradient(100% 100% at 50% 0%, #1a0b2e 0%, #000 70%);
    filter: brightness(0.35);
  }
  .win {
    position: relative;
    width: min(92vw, 380px);
    background: rgba(8, 8, 10, 0.92);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 12px;
    padding: 28px 24px 24px;
    text-align: center;
  }
  .win h1 {
    font-size: 15px;
    letter-spacing: 2px;
    margin-bottom: 6px;
    color: #fff;
  }
  .win p {
    font-size: 12px;
    color: #888;
    margin-bottom: 18px;
  }
  .win input {
    width: 100%;
    background: #111;
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 8px;
    color: #fff;
    padding: 12px;
    font-family: inherit;
    font-size: 13px;
    outline: none;
    text-align: center;
    letter-spacing: 1px;
  }
  .win input:focus { border-color: #ff7a00; }
  .win button {
    width: 100%;
    margin-top: 12px;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(90deg, #ff7a00, #ff2ea6);
    color: #fff;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
  }
  .win button:active { transform: scale(0.98); }
  #err { min-height: 18px; font-size: 12px; color: #ff5555; margin-top: 10px; }
  #load { display: none; margin-top: 14px; font-size: 12px; color: #aaa; }
  #bar-track { height: 4px; background: #222; border-radius: 4px; margin-top: 8px; overflow: hidden; display: none; }
  #bar { height: 100%; width: 0%; background: linear-gradient(90deg, #ff7a00, #ff2ea6, #00e5ff); transition: width 0.2s; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="win">
    <h1>OXIDE MOD</h1>
    <p>введи ключ доступа</p>
    <input type="text" id="key" placeholder="XXXX-XXXX-XXXX" autocomplete="off" spellcheck="false">
    <button onclick="go()">ПРОДОЛЖИТЬ</button>
    <div id="err"></div>
    <div id="load"><span id="ltxt">Поиск игры...</span> <span id="pct">0%</span></div>
    <div id="bar-track"><div id="bar"></div></div>
  </div>
<script>
  const input = document.getElementById('key');
  const err = document.getElementById('err');
  const load = document.getElementById('load');
  const ltxt = document.getElementById('ltxt');
  const pct = document.getElementById('pct');
  const bar = document.getElementById('bar');
  const track = document.getElementById('bar-track');
  input.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  function go() {
    const k = input.value.trim();
    if (k.length < 4) { err.textContent = 'введи ключ'; return; }
    err.textContent = '';
    load.style.display = 'block';
    track.style.display = 'block';
    const steps = [[0, 'Поиск игры...'], [35, 'Подготовка...'], [70, 'Инжект...']];
    let p = 0;
    const t = setInterval(() => {
      p += 2;
      if (p >= 78) {
        p = 78;
        pct.textContent = p + '%';
        bar.style.width = p + '%';
        ltxt.textContent = 'Инжект...';
        clearInterval(t);
        err.textContent = 'Ошибка сервера, попробуйте позже';
        return;
      }
      pct.textContent = p + '%';
      bar.style.width = p + '%';
      for (const [lim, txt] of steps) if (p >= lim) ltxt.textContent = txt;
    }, 60);
  }
</script>
</body>
</html>
